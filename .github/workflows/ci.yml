name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── 质量门：类型检查 + lint + 迁移漂移检查 + 生产构建 ──────────────────
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kai_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kai_shadow?schema=public
      # Shadow DB used by `prisma migrate diff` to replay migrations.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kai_shadow?schema=public

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Fail if schema.prisma has drifted from the committed migrations
      # (i.e. someone changed the schema without running `prisma migrate dev`).
      - name: Prisma migration drift check
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # ── 单元测试：核心 lib 模块（RAG/auth/billing/team），覆盖率阈值门槛 ──
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      # 覆盖率低于阈值（lines/functions/statements 70% / branches 60%）即失败
      - name: Unit tests with coverage
        run: pnpm test:unit

  # ── 集成测试：demo 模式起 dev server，跑 functional + api + performance ──
  # 提高限流阈值避免测试流量误触 429（默认 200/min 用户级）
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Start dev server (demo mode)
        run: |
          RATE_LIMIT_PER_MIN=2000 RATE_LIMIT_ANON_PER_MIN=500 RATE_LIMIT_KEY_PER_MIN=5000 RATE_LIMIT_KB_PER_MIN=1000 \
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/login > /dev/null
      - name: Functional tests
        run: node tests/functional/functional-test.mjs
      - name: API tests
        run: node tests/api/api-test.mjs
      - name: Performance tests
        run: node tests/performance/performance-test.mjs

  # ── 验收 smoke：scripts/smoke/ 下的验收套件（scripts/smoke/run-all.ts） ──
  # 顺序有讲究：limits 组断言文档默认限流档位（anon 20 < kb 60 < user 200 <
  # key 500），必须先在没有抬高限流的 server 窗口上跑；之后写入 .env.local
  # 抬高限流并重启 dev，供 http/ui 组使用。http/ui 还要 --elevate：
  # /api/chat 的路由内 user 档位取 admin store 的 60/min，不受 RATE_LIMIT_PER_MIN
  # 影响，不抬高会被同窗口内多脚本累积触发 429。
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate

      # lib 组不需要 server（解析/分块/检索/日志/主题等纯逻辑）
      - name: Smoke - lib group (no server needed)
        run: npx tsx scripts/smoke/run-all.ts --group lib --parallel 2

      - name: Start dev server (documented default limits)
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null

      # 断言分层顺序与 Retry-After，必须跑在 .env.example 的默认档位窗口上
      - name: Smoke - limits group (default rate-limit tiers)
        run: npx tsx scripts/smoke/run-all.ts --group limits

      - name: Raise rate limits and allow loopback webhook targets
        run: |
          cat >> .env.local <<'EOF'
          # CI smoke: 抬高限流避免多脚本累积触发 429；放行回环地址供 webhook
          # 接收端（仅非生产生效，见 src/lib/security/ssrf.ts）。
          RATE_LIMIT_PER_MIN=2000
          RATE_LIMIT_ANON_PER_MIN=2000
          RATE_LIMIT_KEY_PER_MIN=5000
          RATE_LIMIT_KB_PER_MIN=2000
          RATE_LIMIT_INTEGRATION_PER_MIN=5000
          RATE_LIMIT_AGENT_PER_MIN=500
          SSRF_ALLOW_PRIVATE_HOSTS=true
          EOF
          pkill -f "next dev" 2>/dev/null || true
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health > /dev/null || break
            sleep 1
          done
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null

      - name: Smoke - http group
        run: npx tsx scripts/smoke/run-all.ts --group http --elevate 5000

      # ui 组用 CDP 驱动 Chrome（runner 自带 /usr/bin/google-chrome）
      - name: Smoke - ui group
        run: npx tsx scripts/smoke/run-all.ts --group ui --elevate 5000

      - name: Upload smoke reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: scripts/smoke/.report/
          include-hidden-files: true
          retention-days: 7

  # ── 验收 smoke（infra 组）：脚本各自 spawn 生产实例，需先 build ──────
  # test-health / test-oauth / test-sync / test-vscode / test-integrations 会自己
  # 在 :3100 起 `next start` 生产实例，故先做生产构建；mock Pinecone (:5080) 供
  # test-pinecone 使用。chromadb / OCR 语言包 / DATABASE_URL 缺失的脚本由
  # runner 前置探测判定为 SKIP（不计失败）。
  smoke-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build (standalone test servers run `next start`)
        run: pnpm build
      # The infra scripts need a server on BASE_URL (:3000) for their own
      # setup calls, and they spawn additional production `next start`
      # instances from the `.next` build above. Use `next start` here too
      # instead of `next dev`: a dev server rewrites `.next` underneath those
      # spawned instances (they then answer with non-JSON 500s or never bind).
      - name: Start production server + mock Pinecone
        run: |
          cat >> .env.local <<'EOF'
          # `next start` runs in production mode, where src/lib/secrets.ts
          # refuses to boot without AUTH_SECRET (every route would answer 500).
          # Throwaway value: this server only ever holds in-memory demo data.
          AUTH_SECRET=smoke-acceptance-demo-secret-not-for-production
          RATE_LIMIT_PER_MIN=2000
          RATE_LIMIT_ANON_PER_MIN=2000
          RATE_LIMIT_KEY_PER_MIN=5000
          RATE_LIMIT_KB_PER_MIN=2000
          RATE_LIMIT_INTEGRATION_PER_MIN=5000
          RATE_LIMIT_AGENT_PER_MIN=500
          SSRF_ALLOW_PRIVATE_HOSTS=true
          EOF
          pnpm start -p 3000 > /tmp/app.log 2>&1 &
          npx tsx scripts/smoke/mock-pinecone-server.ts > /tmp/pinecone.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:5080 && break
            sleep 1
          done
          curl -s -o /dev/null http://localhost:5080
      - name: Smoke - infra group
        run: npx tsx scripts/smoke/run-all.ts --group infra
      - name: Upload smoke reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-infra-reports
          path: scripts/smoke/.report/
          include-hidden-files: true
          retention-days: 7

  # ── E2E：Playwright 关键用户流程（登录 → 上传 → 问答 → Agent） ──────
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ── 文档门禁：docs 站点构建（死链即失败）+ Frontmatter 校验 + OpenAPI 参考漂移 ──
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs site (dead links fail the build)
        run: pnpm docs:build
      - name: Validate Frontmatter metadata
        run: npx tsx scripts/tools/check-docs-frontmatter.ts
      - name: Env vars doc parity check
        run: npx tsx scripts/tools/check-env-parity.ts
      - name: API reference drift check
        run: |
          npx tsx scripts/tools/gen-api-reference.ts
          git diff --exit-code -- docs/api/reference.md
