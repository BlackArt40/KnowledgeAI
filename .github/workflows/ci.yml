name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的新推送取消上一轮（PR 迭代时能省掉一整轮 ~15 分钟）；
# 不跨 ref 取消，main 的推送与 PR 的校验互不影响。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 质量门：类型检查 + lint + 迁移漂移检查 + 生产构建 ──────────────────
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kai_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kai_shadow?schema=public
      # Shadow DB used by `prisma migrate diff` to replay migrations.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kai_shadow?schema=public

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Fail if schema.prisma has drifted from the committed migrations
      # (i.e. someone changed the schema without running `prisma migrate dev`).
      - name: Prisma migration drift check
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Lint
        run: pnpm lint

      # 依赖漏洞审计（2026-10-08 dependency audit）：critical 阻断，high 及以下
      # 仅报告。存量修复记录与残留豁免见
      # deliverables/software-company/dependency-remediation-2026-10-08.md。
      - name: Dependency audit (critical fails the job)
        run: pnpm audit --audit-level=critical

      # Next 构建缓存：.next/cache 内部按文件内容寻址，命中旧条目也不会产出错误
      # 产物；key 不跟 commit 走，才能在多次推送之间复用。
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

  # ── 单元测试：核心 lib 模块（RAG/auth/billing/team），覆盖率阈值门槛 ──
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      # 覆盖率低于阈值（lines/functions/statements 70% / branches 60%）即失败
      - name: Unit tests with coverage
        run: pnpm test:unit

  # ── Vue 3 前端（frontend/，V0 起）：独立四门禁，与 Next 八门禁并存 ──────
  # 绞杀迁移期间根仓门禁保持不动；frontend 门禁随阶段扩展（design log 十五·二十七）
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (vue-tsc)
        run: pnpm --filter kai-frontend typecheck
      - name: Lint
        run: pnpm --filter kai-frontend lint
      - name: Unit tests
        run: pnpm --filter kai-frontend test
      - name: Build
        run: pnpm --filter kai-frontend build

  # ── AI 服务契约测试（阶段 3）：租户硬化负例 + SSE/内部令牌契约入 CI ──
  # service-split.md 阶段 3 退出标准：「A3.1～A3.3 必须自动化并纳入 CI」。
  ai-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install AI service
        run: pip install -e "services/ai[dev]"
      - name: AI service contract tests (tenant isolation + auth + SSE)
        run: python -m pytest services/ai/tests -q

  # ── 集成测试：demo 模式起 dev server，跑 functional + api + performance ──
  # 提高限流阈值避免测试流量误触 429（默认 200/min 用户级）
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Start dev server (demo mode)
        run: |
          RATE_LIMIT_PER_MIN=2000 RATE_LIMIT_ANON_PER_MIN=500 RATE_LIMIT_KEY_PER_MIN=5000 RATE_LIMIT_KB_PER_MIN=1000 \
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null
      # V6：Next 纯 API——页面由 frontend dist 的 vite preview（:4173）承载
      - name: Build frontend + start preview
        run: |
          pnpm --filter kai-frontend build > /tmp/fe-build.log 2>&1
          pnpm --filter kai-frontend exec vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4173/ > /dev/null
      - name: Functional tests
        run: node tests/functional/functional-test.mjs
      - name: API tests
        run: node tests/api/api-test.mjs
      - name: Performance tests
        run: node tests/performance/performance-test.mjs

  # ── 验收 smoke：scripts/smoke/ 下的验收套件（scripts/smoke/run-all.ts） ──
  # 顺序有讲究：limits 组断言文档默认限流档位（anon 20 < kb 60 < user 200 <
  # key 500），必须先在没有抬高限流的 server 窗口上跑；之后写入 .env.local
  # 抬高限流并重启 dev，供 http/ui 组使用。http/ui 还要 --elevate：
  # /api/chat 的路由内 user 档位取 admin store 的 60/min，不受 RATE_LIMIT_PER_MIN
  # 影响，不抬高会被同窗口内多脚本累积触发 429。
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate

      # lib 组不需要 server（解析/分块/检索/日志/主题等纯逻辑）
      - name: Smoke - lib group (no server needed)
        run: npx tsx scripts/smoke/run-all.ts --group lib --parallel 2

      - name: Start dev server (documented default limits)
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null

      # 断言分层顺序与 Retry-After，必须跑在 .env.example 的默认档位窗口上
      - name: Smoke - limits group (default rate-limit tiers)
        run: npx tsx scripts/smoke/run-all.ts --group limits

      - name: Raise rate limits and allow loopback webhook targets
        run: |
          cat >> .env.local <<'EOF'
          # CI smoke: 抬高限流避免多脚本累积触发 429；放行回环地址供 webhook
          # 接收端（仅非生产生效，见 src/lib/security/ssrf.ts）。
          RATE_LIMIT_PER_MIN=2000
          RATE_LIMIT_ANON_PER_MIN=2000
          RATE_LIMIT_KEY_PER_MIN=5000
          RATE_LIMIT_KB_PER_MIN=2000
          RATE_LIMIT_INTEGRATION_PER_MIN=5000
          RATE_LIMIT_AGENT_PER_MIN=500
          SSRF_ALLOW_PRIVATE_HOSTS=true
          EOF
          pkill -f "next dev" 2>/dev/null || true
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health > /dev/null || break
            sleep 1
          done
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null

      # V8 修正：preview 提前到 http 组之前——test-openapi 的 /docs 断言打
      # PAGE_URL(:4173)，http 组在 preview 缺席时会 ECONNREFUSED（本地 preview
      # 常驻所以从未暴露）。ui 组复用同一 preview。
      - name: Build frontend + start preview
        run: |
          pnpm --filter kai-frontend build > /tmp/fe-build.log 2>&1
          pnpm --filter kai-frontend exec vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4173/ > /dev/null

      # 注意：http 与 ui 两组**故意串行**。两组虽然打不同端口（:3000 / :4173），
      # 但都是 CPU 密集（Next dev + 解析/嵌入 + Chrome/CDP）。2026-10-23 实测并行
      # 一次：http 组从 291s 涨到 820s，并出现 test-sdk 180s 超时（断言 9/9 全过却
      # 被 runner 掐断）、monitoring/webhooks/graph-rag/multimodal 断言失败；同机器
      # 串行复跑 test-monitoring 32s 全绿。runner 只有 4 核，别再并行这两组。
      - name: Smoke - http group
        run: npx tsx scripts/smoke/run-all.ts --group http --elevate 5000

      # ui 组用 CDP 驱动 Chrome（runner 自带 /usr/bin/google-chrome）；
      # 页面由上方已拉起的 vite preview（:4173，frontend dist）承载
      - name: Smoke - ui group
        run: npx tsx scripts/smoke/run-all.ts --group ui --elevate 5000

      - name: Upload smoke reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: scripts/smoke/.report/
          include-hidden-files: true
          retention-days: 7

  # ── 验收 smoke（infra 组）：脚本各自 spawn 生产实例，需先 build ──────
  # test-health / test-oauth / test-sync / test-vscode / test-integrations 会自己
  # 在 :3100 起 `next start` 生产实例，故先做生产构建；mock Pinecone (:5080) 供
  # test-pinecone 使用。chromadb / OCR 语言包 / DATABASE_URL 缺失的脚本由
  # runner 前置探测判定为 SKIP（不计失败）。
  smoke-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (standalone test servers run `next start`)
        run: pnpm build
      # The infra scripts need a server on BASE_URL (:3000) for their own
      # setup calls, and they spawn additional production `next start`
      # instances from the `.next` build above. Use `next start` here too
      # instead of `next dev`: a dev server rewrites `.next` underneath those
      # spawned instances (they then answer with non-JSON 500s or never bind).
      - name: Start production server + mock Pinecone
        run: |
          cat >> .env.local <<'EOF'
          # `next start` runs in production mode, where src/lib/secrets.ts
          # refuses to boot without AUTH_SECRET (every route would answer 500).
          # Throwaway value: this server only ever holds in-memory demo data.
          AUTH_SECRET=smoke-acceptance-demo-secret-not-for-production
          RATE_LIMIT_PER_MIN=2000
          RATE_LIMIT_ANON_PER_MIN=2000
          RATE_LIMIT_KEY_PER_MIN=5000
          RATE_LIMIT_KB_PER_MIN=2000
          RATE_LIMIT_INTEGRATION_PER_MIN=5000
          RATE_LIMIT_AGENT_PER_MIN=500
          SSRF_ALLOW_PRIVATE_HOSTS=true
          EOF
          pnpm start -p 3000 > /tmp/app.log 2>&1 &
          npx tsx scripts/smoke/mock-pinecone-server.ts > /tmp/pinecone.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:5080 && break
            sleep 1
          done
          curl -s -o /dev/null http://localhost:5080
      - name: Smoke - infra group
        run: npx tsx scripts/smoke/run-all.ts --group infra
      # E5 (engineering-assurance 2026-09-30): reclaim the servers this job and
      # the infra scripts spawned. Without it a `next start` child (and the
      # mock servers) can outlive the step as an orphan and keep holding :3000,
      # which is exactly the "server was shut down but still answers" shape
      # from the login-page incident. Runs even when the smoke group failed -
      # a failed run is when leftovers are most likely. `|| true` keeps the
      # job's real result intact; the assertion below is the actual check.
      - name: Teardown - reclaim spawned servers
        if: always()
        run: |
          pkill -TERM -f 'next-server|next start|mock-pinecone-server|pnpm start' 2>/dev/null || true
          sleep 2
          pkill -KILL -f 'next-server|next start|mock-pinecone-server|pnpm start' 2>/dev/null || true
          sleep 1
          if pgrep -f 'next-server|mock-pinecone-server' > /dev/null; then
            echo "::error::teardown failed - spawned server processes are still alive:"
            pgrep -af 'next-server|mock-pinecone-server' || true
            exit 1
          fi
          echo "teardown ok - no spawned server processes remain"
      - name: Upload smoke reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-infra-reports
          path: scripts/smoke/.report/
          include-hidden-files: true
          retention-days: 7

  # ── E2E：Playwright 关键用户流程（登录 → 上传 → 问答 → Agent） ──────
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: npx prisma generate
      # 浏览器二进制缓存（~130MB）；apt 系统库无法缓存，故保留 --with-deps。
      # install 是幂等的：缓存的 revision 与 lockfile 不匹配时会补下载。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # V6：页面由 vite preview 承载——webServer[1] 的 command 内含构建；
      # 此处显式构建一次以便构建错误在独立步骤暴露（含 SEO 预渲染）
      - name: Build frontend (Vue dist + prerendered home)
        run: pnpm --filter kai-frontend build
      - name: E2E tests
        run: pnpm test:e2e
      # V7：frontend/e2e 并入 CI（31 用例：认证/工作台/知识库/聊天+Agent/管理端
      # 门禁）——其 webServer 自动拉起 Next dev(:3000, 抬高限流) + vite dev(:5173)，
      # 根 e2e 结束时已释放端口，无冲突
      - name: Frontend E2E tests (Vue suite)
        run: pnpm --filter kai-frontend test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # ── 文档门禁：docs 站点构建（死链即失败）+ Frontmatter 校验 + OpenAPI 参考漂移 ──
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs site (dead links fail the build)
        run: pnpm docs:build
      - name: Validate Frontmatter metadata
        run: npx tsx scripts/tools/check-docs-frontmatter.ts
      - name: Env vars doc parity check
        run: npx tsx scripts/tools/check-env-parity.ts
      - name: API reference drift check
        run: |
          npx tsx scripts/tools/gen-api-reference.ts
          git diff --exit-code -- docs/api/reference.md
