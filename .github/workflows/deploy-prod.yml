name: Deploy Production (Blue/Green)

# P6-3: 生产部署。手动触发 + environment 保护规则（GitHub 手动审批门）→
# 构建镜像推 GHCR → 服务器执行蓝绿切换（健康检查通过才接管 :3000）。
#
# 使用前:
#   1. GitHub → Settings → Environments → 创建 `production` environment，
#      启用 "Required reviewers"（手动审批门）。
#   2. 配置仓库 secrets: PROD_HOST / PROD_USER / PROD_SSH_KEY / PROD_PORT。
#   3. 服务器侧: scripts/deploy/blue-green.sh 依赖 docker + .env 文件。
#
# 回滚: 重新触发本 workflow 并指定上一个镜像 tag，蓝绿脚本会自动回滚失败的切换。
#
# 注意:
# - job 级 `if` 不允许 secrets 上下文（GitHub 限制），未配置 PROD_HOST
#   时的跳过判断经 job 级 env 代理后在 step 级 `if` 里用 env 完成。
# - GHCR 镜像名必须小写：github.repository 保留原始大小写，经 shell
#   ${VAR,,} 转小写后通过 build job 的 outputs 传递（steps 上下文不能跨 job）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（留空 = 使用 main 最新构建）"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production # 手动审批门
    outputs:
      image: ${{ steps.img.outputs.value }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image reference
        id: img
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: meta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.value }}:prod-${{ steps.tag.outputs.value }}
            ${{ steps.img.outputs.value }}:latest-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  blue-green:
    runs-on: ubuntu-latest
    needs: build
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Blue/green deploy over SSH
        if: ${{ env.PROD_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || '22' }}
          script: |
            cd ${{ secrets.PROD_DIR || '/srv/knowledgeai' }}
            # 同步更新 worker 容器，保证队列消费端与 app 版本一致
            export KAI_WORKER_IMAGE=${{ needs.build.outputs.image }}:prod-${{ needs.build.outputs.tag }}
            bash scripts/deploy/blue-green.sh ${{ needs.build.outputs.image }}:prod-${{ needs.build.outputs.tag }} \
              ${{ secrets.PROD_APP_NAME || 'kai-app' }} \
              ${{ secrets.PROD_PORT_EXTERNAL || '3000' }} \
              ${{ secrets.PROD_ENV_FILE || '.env' }}
