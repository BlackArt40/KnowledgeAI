name: Deploy Staging

# P6-3: push main → 构建 Docker 镜像推 GHCR → SSH 部署 staging。
# 服务器未配置 secrets 时 staging job 自动跳过（镜像仍会构建推送）。
#
# 需要配置的仓库 secrets（GitHub → Settings → Secrets and variables → Actions）:
#   STAGING_HOST     服务器 IP / 域名
#   STAGING_USER     SSH 用户
#   STAGING_SSH_KEY  SSH 私钥（部署用，服务器侧需加入 authorized_keys）
#   STAGING_PORT     SSH 端口（默认 22）
# 服务器侧: docker + docker compose 可用；镜像仓库需允许匿名拉取或配置 docker login。
#
# 注意:
# - job 级 `if` 不允许 secrets 上下文（GitHub 限制），未配置 STAGING_HOST
#   时的跳过判断经 job 级 env 代理后在 step 级 `if` 里用 env 完成。
# - GHCR 镜像名必须小写：github.repository 保留原始大小写，经 shell
#   ${VAR,,} 转小写后通过 build job 的 outputs 传给下游。

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image reference
        id: img
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: meta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.value }}:staging-${{ github.sha }}
            ${{ steps.img.outputs.value }}:latest-staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    runs-on: ubuntu-latest
    needs: build
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        if: ${{ env.STAGING_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || '22' }}
          script: |
            cd ${{ secrets.STAGING_DIR || '/srv/knowledgeai' }}
            bash scripts/deploy/staging.sh ${{ needs.build.outputs.image }}:staging-${{ github.sha }} .
