allowBuilds:
  '@prisma/engines': true
  '@prisma/client': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  msgpackr-extract: false
  tesseract.js: false
  '@scarf/scarf': false

# P1-5: force vulnerable transitive deps to patched versions
# (postcss <8.5.18 arbitrary-file-read, sharp <0.35.0 libvips, nanoid <3.3.18
# ReDoS/loop, deepmerge-ts <8.0.0 stack exhaustion).
overrides:
  sharp: ^0.35.0
  deepmerge-ts: ^8.0.0
  'nanoid@<3.3.18': ^3.3.18
  postcss: ^8.5.18
