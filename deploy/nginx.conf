# ── 阶段 6 网关（6.2）：/api → 业务服务（多副本 upstream）；其余 → 前端 ──────
# SSE 硬保证（A6.3）：proxy_buffering off + proxy_read_timeout 3600s —— 网关
# 不缓冲、不掐断长流；上游（Java/Python）另带 X-Accel-Buffering: no 双保险。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 75s;

    # 业务服务多副本：Docker DNS 启动时解析，全部地址 round-robin；
    # max_fails/fail_timeout 摘除连不上的副本（A6.2 滚动发布时的重试基础）。
    # 滚动发布扩缩副本后执行 `nginx -s reload` 优雅重新解析（不中断在途请求）。
    upstream business {
        server business:8080 max_fails=2 fail_timeout=5s;
    }

    upstream frontend {
        server app:3000;
    }

    server {
        listen 80;

        # 业务 API（同域反代，手册 6.1 推荐继续同域：Cookie 不跨域、无 CORS 负担）
        location /api/ {
            proxy_pass http://business;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE/长连接：清空 Connection 头启用 keepalive 透传
            proxy_set_header Connection "";

            # ── SSE 硬保证（A6.3）───────────────────────────────────────────
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;

            # ── 非 SSE 请求的副本故障重试（A6.2）──────────────────────────
            # 连接失败/超时/502/503 → 自动换下一副本重试（幂等读 + 可重试写）
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 3s;
        }

        # ── 前端绞杀切流（V1 起，Vue 3 重写）────────────────────────────
        # frontend-switch.conf 由 scripts/deploy/switch-frontend.sh 从
        # deploy/nginx/routes.conf 生成并 reload；为空时所有页面流量落到
        # 下面的 location / 兜底（Next）。nginx 语义：精确 location（=）与
        # 正则/前缀 location 的优先级高于 location / 前缀兜底。
        include /etc/nginx/frontend-switch.conf;

        # Next 兜底（V6 起 Next 为纯 API，页面全由 switch conf 的 Vue 静态
        # 承载）：此兜底现只服务 Next public/ 单源静态资产——/vendor/swagger-ui
        # （/docs 页引用）、/widget（可嵌入挂件）、/sw.js 等单源不拷贝、
        # 「经网关兜底可达」的资产；未切流页面路径由 Next 404。
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE/长连接 keepalive 透传（与 /api/ 同口径）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }
}
