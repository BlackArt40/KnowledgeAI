# 本地开发 / 单机部署编排：app（Next standalone）+ worker（BullMQ）+ Redis + PostgreSQL(pgvector)。
#
# 环境变量（KAI_ENV_FILE，默认 .env.local；服务器部署传 .env）提供 AUTH_SECRET 等
# 其余配置。DATABASE_URL / REDIS_URL 默认指向本编排的服务名（容器内 localhost 是
# 容器自己，不能复用宿主机的 localhost 地址）；如需外部 DB/Redis，用环境变量覆盖：
#   DATABASE_URL=postgresql://user:pwd@db-host:5432/knowledgeai
#   REDIS_URL=redis://redis-host:6379
# PostgreSQL 账号与 DATABASE_URL 保持一致：POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB。

services:
  app:
    build: .
    env_file: ${KAI_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:knowledgeai-dev@postgres:5432/knowledgeai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # 阶段 1 服务拆分：非空 = 索引/检索/生成走下方 ai 服务（Python RAG）
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # P1: 队列消费者在下面独立的 worker 服务；web 只入队，避免双消费。
      # 单容器跑 Redis 队列时改为 QUEUE_CONSUMER=web。
      QUEUE_CONSUMER: ${QUEUE_CONSUMER:-worker}
      # 限流档位可配置（性能测试等场景需调高，如 RATE_LIMIT_PER_MIN=2000）
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      RATE_LIMIT_ANON_PER_MIN: ${RATE_LIMIT_ANON_PER_MIN:-20}
      RATE_LIMIT_KEY_PER_MIN: ${RATE_LIMIT_KEY_PER_MIN:-500}
      RATE_LIMIT_KB_PER_MIN: ${RATE_LIMIT_KB_PER_MIN:-60}
    ports:
      - "3000:3000"
    volumes:
      # app 与 worker 共享上传目录：doc-process 在 worker 里读 app 写入的文件
      - uploads:/app/.uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # P6-4: liveness probe (dependency connectivity = /api/health/ready)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Background worker: consumes the BullMQ queue (doc-process, agent-run,
  # index-cleanup). Runs the same image as the app but overrides the command
  # to start the worker entrypoint instead of `next start`. Shares REDIS_URL
  # so the app (producer) and worker (consumer) talk to the same queue.
  worker:
    build: .
    command: ["node", "worker.js"]
    env_file: ${KAI_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:knowledgeai-dev@postgres:5432/knowledgeai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # P1: explicit role (default worker); overrides env_file so a stray
      # QUEUE_CONSUMER=web in .env.local can't disable the only consumer.
      QUEUE_CONSUMER: ${QUEUE_CONSUMER:-worker}
      # 阶段 1 服务拆分：doc-process 队列任务在 worker 里转发到 ai 服务
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # 限流档位可配置（性能测试等场景需调高，如 RATE_LIMIT_PER_MIN=2000）
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      RATE_LIMIT_ANON_PER_MIN: ${RATE_LIMIT_ANON_PER_MIN:-20}
      RATE_LIMIT_KEY_PER_MIN: ${RATE_LIMIT_KEY_PER_MIN:-500}
      RATE_LIMIT_KB_PER_MIN: ${RATE_LIMIT_KB_PER_MIN:-60}
    volumes:
      - uploads:/app/.uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # worker 是纯队列消费者，无 HTTP 端口——禁用镜像自带的 wget HEALTHCHECK，
    # 进程存活由 restart: unless-stopped 保障。
    healthcheck:
      disable: true
    restart: unless-stopped

  # AI 服务（阶段 1 拆分，services/ai/）：文档解析/切片/嵌入/检索/生成。
  # 仅内网可达 —— 不映射宿主端口（service-split.md 契约 #1：Python 不对公网）。
  # 阶段 2：不再挂载 uploads 共享卷 —— 文件经对象存储（presignedUrl/s3 源）获取。
  ai:
    build: ./services/ai
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # compose 内网中的对象存储属于该部署的生产配置
      # P2: fail-closed；预签名 URL 指向 compose 内 MinIO 时由 S3_ENDPOINT 主机白名单放行
      AI_ALLOW_PRIVATE_FETCH: "${AI_ALLOW_PRIVATE_FETCH:-false}"
      # source.type=s3 拉取对象用（与业务侧同凭据；presignedUrl 模式不需要）
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-knowledgeai-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      # LLM / 嵌入透传（与 app 共用同一网关形态；留空 = 本地抽取式演示模式）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 对象存储（阶段 2）：MinIO（S3 兼容）。9000=S3 API，9001=控制台（本机验收
  # 「控制台可见对象」用；生产可去掉端口映射）。bucket 默认私有 —— 匿名 GET 403。
  # P2: 仅 S3 存储时需要 —— 放进 s3 profile，默认 up 不拉取（不阻塞无 S3 部署）。
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API（本机 boto3/mc 验收用）
      - "9001:9001" # 控制台
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 启动时确保 bucket 存在（默认私有，不设匿名策略）
  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p --ignore-existing local/$${S3_BUCKET:-knowledgeai-uploads} &&
      echo 'minio-init: bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-knowledgeai-uploads}

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Bootstrap（新电脑部署零手动步骤）────────────────────────────────────
  # 一次性容器：prisma migrate deploy（空库建全部表）+ 演示数据 seed。
  # 使用 deps 阶段镜像（含 prisma CLI / tsx / pino），挂载 prisma/ 与 src/。
  # 幂等：重复 up 为 no-op；已有数据时 KB 种子自动跳过。
  migrate:
    build:
      context: .
      target: deps
    working_dir: /app
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts"
    env_file: ${KAI_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:knowledgeai-dev@postgres:5432/knowledgeai}
    volumes:
      - ./prisma:/app/prisma:ro
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # pgvector image: the KbChunk embedding column needs the `vector` extension
  # (created via raw SQL - see prisma migrations / src/lib/rag).
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgeai-dev}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgeai}
    ports:
      - "5432:5432" # 便于本机 psql/prisma 直连；与宿主已有 Postgres 冲突时可去掉
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-knowledgeai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  postgres-data:
  uploads:
  minio-data:
