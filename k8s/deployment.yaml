# ⚠️ 示例清单（EXAMPLE ONLY）—— 不可直接用于生产
#
# 本文件仅演示探针与卷的接线方式，**未满足生产运行的租户/存储前提**。直接
# `kubectl apply` 到多节点集群会导致：ReadWriteOnce 卷 Multi-Attach 使后到
# Pod CrashLoop、未配置 REDIS_URL 时撤销/限流/队列状态无法跨实例一致等一连
# 串问题（见 deliverables/engineering-assurance/ 的 X1/X2/X3 硬门）。
#
# 扩容前置条件（必须全部满足后才可把 app replicas 调 > 1；2026-10-08 更新）：
#   1. ✅ 鉴权/撤销读路径已共享化（F5）：apiKey 校验在内存未命中时回源 DB；
#      JWT jti 黑名单经共享 Redis 跨实例生效（src/lib/auth/jti-shared.ts）。
#      **多副本必须配置 REDIS_URL**，否则撤销退回本实例内存（就绪探针以
#      revocationDegraded 暴露该降级状态）。
#   2. ⏳ uploads 卷仍为 RWO（单节点示例）。多节点/多副本必须二选一：
#      - RWX：换用支持 ReadWriteMany 的存储类（NFS/CephFS 等）；
#      - 对象存储：配置 S3_ENDPOINT / S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY，
#        分片上传链路直接读写 S3/MinIO（不落本地盘）。
#      注意：直传（非分片）上传及后台解析仍读写本地 .uploads —— 多节点下必须
#      RWX，或把上传统一改走分片上传 + 对象存储。
#   3. ✅ 队列背压已上线（X5/X6 的入队防护）：QUEUE_MAX_DEPTH（默认 500/队列）
#      达上限即拒绝新任务，就绪探针暴露 queueBackpressured；存量积压的自动
#      处置与主动告警仍为人工巡检（RB-03）。
# 当前唯一剩余硬前置为 ② —— 完成前请保持 replicas: 1。
#
# P6-4: Kubernetes 示例清单（健康检查与就绪探针）
#
# 用法：替换镜像占位符后 apply（仅限单副本试用/联调）。
#   kubectl apply -f k8s/deployment.yaml
#
# 探针语义（与 /api/health* 对应）：
#   startupProbe  -> 首次启动容错（就绪探针在依赖就绪前允许失败）
#   livenessProbe -> GET /api/health（进程存活，与依赖无关，恒 200）
#   readinessProbe-> GET /api/health/ready（DB/Redis/LLM 连通；依赖不可用返回 503 -> 摘流量）
#
# 依赖（DB/Redis）应作为同命名空间的 Service 提供；镜像通过
# DATABASE_URL / REDIS_URL 环境变量指向它们（示例用 Secret 占位）。
#
# worker：BullMQ 消费端（doc-process / agent-run / index-cleanup）必须单独部署，
# 否则队列任务永远无人处理（app 只写队列不消费）。
# uploads 卷：app 与 worker 共享上传目录（worker 读取 app 写入的文档文件）。
# 单节点示例用 ReadWriteOnce PVC；多副本生产建议 RWX 或对象存储（UPLOAD_DIR 为
# 相对路径 .uploads，也可改为挂载对象存储的路径）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledgeai-uploads
spec:
  # X2: ReadWriteOnce = 单节点读写。app + worker 同节点时可共享；**跨节点
  # 多副本开箱即坏**（Multi-Attach -> 后到 Pod Pending/CrashLoop）。
  #
  # 多节点方案 A（RWX）：换用支持 ReadWriteMany 的存储类：
  #   storageClassName: nfs-client      # 替换为集群实际的 RWX 存储类
  #   accessModes:
  #     - ReadWriteMany
  # 多节点方案 B（对象存储）：保持本卷用于直传链路，或统一改走分片上传 +
  #   S3/MinIO（配置 S3_* 环境变量后分片链路不落本地盘），详见文件头前置条件 ②。
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeai
  labels:
    app: knowledgeai
spec:
  # X1: 保持 1 —— 当前剩余硬前置是 uploads RWO 卷（多节点 Multi-Attach 崩溃），
  # 且本示例未配置 REDIS_URL。鉴权/撤销读路径（F5，ADR-0006）与队列背压
  # （X5/X6，ADR-0007）已在代码层改造完成；扩容到多副本前请先满足文件头
  # 前置条件（②，并配置 REDIS_URL）。
  replicas: 1
  selector:
    matchLabels:
      app: knowledgeai
  template:
    metadata:
      labels:
        app: knowledgeai
    spec:
      securityContext:
        fsGroup: 1001 # 让 uploads PVC 组归属 1001，nextjs(uid 1001) 可写
      containers:
        - name: app
          # 替换为实际镜像（与 deploy 工作流推送的 GHCR tag 对应）
          image: ghcr.io/your-org/knowledgeai:latest-prod
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: REDIS_URL
          volumeMounts:
            - name: uploads
              mountPath: /app/.uploads
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30 # 30 * 2s = 60s 启动容错
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3 # 依赖不可用时返回 503 -> 从 Service 摘除流量
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: knowledgeai-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeai-worker
  labels:
    app: knowledgeai-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledgeai-worker
  template:
    metadata:
      labels:
        app: knowledgeai-worker
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/your-org/knowledgeai:latest-prod
          command: ["node", "worker.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: REDIS_URL
          volumeMounts:
            - name: uploads
              mountPath: /app/.uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: knowledgeai-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: knowledgeai
spec:
  selector:
    app: knowledgeai
  ports:
    - port: 80
      targetPort: 3000
