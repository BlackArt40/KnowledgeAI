# ⚠️ 示例清单（EXAMPLE ONLY）—— 不可直接用于生产
#
# 本文件仅演示探针与卷的接线方式，**未满足生产运行的租户/存储前提**。直接
# `kubectl apply` 到多节点集群会导致：多副本鉴权/限流状态不一致（内存
# store 为读路径事实源）、ReadWriteOnce 卷 Multi-Attach 使后到 Pod
# CrashLoop、以及租户数据归属依赖单实例内存等一连串问题（见
# deliverables/engineering-assurance/pre-deploy-go-no-go-knowledgeai-2026-09-30.md
# 的 X1/X2/X3 硬门）。
#
# 扩容前置条件（必须全部满足后才可把 app replicas 调 > 1）：
#   1. 鉴权/限流/撤销等读路径改走 DB 或共享 Redis（apiKey 校验、JWT jti 黑名单）；
#   2. uploads 卷改 RWX 或对象存储（S3/MinIO），否则 RWO 无法跨节点/跨 Pod 共享；
#   3. 队列加入深度/内存背压与告警（当前 1Gi limit 下无界内存队列有 OOMKilled 风险）。
#
# P6-4: Kubernetes 示例清单（健康检查与就绪探针）
#
# 用法：替换镜像占位符后 apply（仅限单副本试用/联调）。
#   kubectl apply -f k8s/deployment.yaml
#
# 探针语义（与 /api/health* 对应）：
#   startupProbe  -> 首次启动容错（就绪探针在依赖就绪前允许失败）
#   livenessProbe -> GET /api/health（进程存活，与依赖无关，恒 200）
#   readinessProbe-> GET /api/health/ready（DB/Redis/LLM 连通；依赖不可用返回 503 -> 摘流量）
#
# 依赖（DB/Redis）应作为同命名空间的 Service 提供；镜像通过
# DATABASE_URL / REDIS_URL 环境变量指向它们（示例用 Secret 占位）。
#
# worker：BullMQ 消费端（doc-process / agent-run / index-cleanup）必须单独部署，
# 否则队列任务永远无人处理（app 只写队列不消费）。
# uploads 卷：app 与 worker 共享上传目录（worker 读取 app 写入的文档文件）。
# 单节点示例用 ReadWriteOnce PVC；多副本生产建议 RWX 或对象存储（UPLOAD_DIR 为
# 相对路径 .uploads，也可改为挂载对象存储的路径）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledgeai-uploads
spec:
  # X2: ReadWriteOnce = 单节点读写。app + worker 同节点时可共享；**跨节点
  # 多副本开箱即坏**（Multi-Attach -> 后到 Pod Pending/CrashLoop）。
  # 生产多副本必须改 ReadWriteMany 或对象存储（S3/MinIO）。
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeai
  labels:
    app: knowledgeai
spec:
  # X1: 必须保持 1。内存 globalThis store 是鉴权（apiKey 校验、JWT jti 撤销
  # 黑名单）与限流计数的读路径事实源；多副本会让跨实例鉴权/撤销静默失效，
  # 并与 RWO 卷冲突。扩容前请先满足文件头的三条前置条件。
  replicas: 1
  selector:
    matchLabels:
      app: knowledgeai
  template:
    metadata:
      labels:
        app: knowledgeai
    spec:
      securityContext:
        fsGroup: 1001 # 让 uploads PVC 组归属 1001，nextjs(uid 1001) 可写
      containers:
        - name: app
          # 替换为实际镜像（与 deploy 工作流推送的 GHCR tag 对应）
          image: ghcr.io/your-org/knowledgeai:latest-prod
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: REDIS_URL
          volumeMounts:
            - name: uploads
              mountPath: /app/.uploads
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30 # 30 * 2s = 60s 启动容错
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3 # 依赖不可用时返回 503 -> 从 Service 摘除流量
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: knowledgeai-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeai-worker
  labels:
    app: knowledgeai-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledgeai-worker
  template:
    metadata:
      labels:
        app: knowledgeai-worker
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/your-org/knowledgeai:latest-prod
          command: ["node", "worker.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-env
                  key: REDIS_URL
          volumeMounts:
            - name: uploads
              mountPath: /app/.uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: knowledgeai-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: knowledgeai
spec:
  selector:
    app: knowledgeai
  ports:
    - port: 80
      targetPort: 3000
